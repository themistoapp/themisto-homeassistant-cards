<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Themisto cards showcase</title>
  <style>
    :root { color-scheme: dark; --bg: #060910; --blue-color: #3b82f6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { color: #eef2f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(44% 38% at 10% 3%, rgba(54,104,177,.18), transparent 72%), radial-gradient(38% 34% at 94% 22%, rgba(133,71,46,.14), transparent 72%); }
    main { position: relative; width: min(1080px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    header span { color: #77859c; font-size: 12px; }
    #cards { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; align-items: start; }
    .cell { min-width: 0; }
    .vehicle { grid-column: span 6; height: 184px; }
    .lights { grid-column: span 6; }
    .energy { grid-column: span 6; height: 376px; }
    .sonos { grid-column: span 6; height: 248px; }
    body.single { width: 400px; min-height: 0; overflow: hidden; }
    body.single::before, body.single header { display: none; }
    body.single main { width: 400px; margin: 0; padding: 0; }
    body.single #cards { display: block; width: 400px; }
    body.single .cell { width: 400px; }
    @media (max-width: 760px) {
      main { width: min(620px, calc(100% - 24px)); padding-top: 18px; }
      .vehicle, .lights, .energy, .sonos { grid-column: 1 / -1; }
      .vehicle { height: 184px; }
      .energy { height: 360px; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>Home</h1><span>Configured card preview</span></header>
    <div id="cards"></div>
  </main>
  <script type="module" src="./showcase.ts"></script>
</body>
</html>
