<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Themisto Cards · dev harness</title>
<style>
  :root { --red-color: #f44336; --amber-color: #ffc107; --green-color: #4caf50; --blue-color: #2196f3; --teal-color: #009688; --deep-purple-color: #6e41ab; --orange-color: #ff9800; --primary-color: #03a9f4;
    --bg: #e6edfa; --text: #111a2c; --muted: #6a7c99; --line: rgba(17,26,44,.1); --cell: rgba(36,81,214,.06); --solid: #fff; --accent: #2451d6; --sw: 620px; }
  :root[data-theme="dark"] { --bg: #04070e; --text: #e8edf5; --muted: #7a90b2; --line: rgba(140,180,240,.14); --cell: rgba(111,169,244,.06); --solid: #101a2e; --accent: #6fa9f4; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(40% 35% at 12% 8%, #8fbaf366, transparent 70%), radial-gradient(35% 30% at 92% 20%, #ffc39b55, transparent 70%); }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 20px; }
  h1 { margin: 0 0 12px; font: 900 32px/1 Themisto, sans-serif; text-transform: uppercase; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 0; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .ctl { display: flex; align-items: center; gap: 8px; font: 600 10px ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .pseg { display: flex; padding: 3px; gap: 2px; border-radius: 10px; border: 1px solid var(--line); }
  .pseg button { font: 600 12px -apple-system, sans-serif; color: var(--muted); background: none; border: 0; height: 26px; padding: 0 10px; border-radius: 7px; cursor: pointer; }
  .pseg button[aria-pressed="true"] { background: var(--solid); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  #log { flex-basis: 100%; font: 12px ui-monospace, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log.flash { color: var(--accent); }
  .sec { margin-top: 36px; }
  .sec h2 { margin: 0 0 12px; font: 900 22px/1 Themisto, sans-serif; text-transform: uppercase; }
  .gridwrap { position: relative; width: min(var(--sw), 100%); }
  .ha-grid, .cells { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 56px; gap: 8px; }
  .ha-grid { position: relative; grid-auto-flow: row dense; }
  .cells { position: absolute; inset: 0; pointer-events: none; }
  .cells i { background: var(--cell); border-radius: 6px; }
  .nogrid .cells { display: none; }
  .cell { min-width: 0; min-height: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Themisto Cards</h1>
  <div class="bar">
    <div class="ctl">Theme <div class="pseg" id="theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark" aria-pressed="false">Dark</button></div></div>
    <div class="ctl">Data <div class="pseg" id="data"><button data-v="normal" aria-pressed="true">Normal</button><button data-v="worst" aria-pressed="false">Worst case</button><button data-v="unavail" aria-pressed="false">Unavailable</button></div></div>
    <label class="ctl">Section width <input id="sw" type="range" min="300" max="1100" step="10" value="620"><span id="swv"></span></label>
    <div class="ctl">Live updates <div class="pseg" id="live"><button data-v="off" aria-pressed="true">Off</button><button data-v="on" aria-pressed="false">On</button></div></div>
    <div class="ctl">Grid <div class="pseg" id="grid"><button data-v="show" aria-pressed="true">Show</button><button data-v="hide" aria-pressed="false">Hide</button></div></div>
    <div id="log">Service calls appear here.</div>
  </div>
  <div id="app"></div>
</div>
<script type="module" src="./harness.ts"></script>
</body>
</html>
